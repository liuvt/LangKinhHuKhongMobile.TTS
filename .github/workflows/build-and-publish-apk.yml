name: Build & Publish Runnable APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Real ONNX Voice Models, Sherpa-ONNX AAR & espeak-ng-data from voices-assets branch
        run: |
          if git ls-remote --exit-code --heads origin voices-assets >/dev/null 2>&1; then
            git fetch origin voices-assets --depth=1
            git checkout origin/voices-assets -- Voices/ app/libs/ app/src/main/assets/espeak-ng-data/
            ls -lh Voices/*/*.onnx app/libs/sherpa-onnx-1.12.40.aar
            ls -la app/src/main/assets/espeak-ng-data | head -n 15
          else
            echo "voices-assets branch not found"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Sherpa-ONNX v1.12.40 AAR & espeak-ng-data
        run: |
          if [ ! -f app/libs/sherpa-onnx-1.12.40.aar ]; then
            mkdir -p app/libs
            curl -L --retry 8 --retry-all-errors --retry-delay 5 -f -o app/libs/sherpa-onnx-1.12.40.aar \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.40/sherpa-onnx-1.12.40.aar"
          fi
          if [ ! -d app/src/main/assets/espeak-ng-data ]; then
            mkdir -p app/src/main/assets
            curl -L --retry 8 --retry-all-errors --retry-delay 5 -f -o /tmp/espeak-ng-data.tar.bz2 \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/espeak-ng-data.tar.bz2"
            tar -xjf /tmp/espeak-ng-data.tar.bz2 -C app/src/main/assets
          fi
          ls -lh app/libs/sherpa-onnx-1.12.40.aar
          ls -la app/src/main/assets/espeak-ng-data | head -n 15

      - name: Generate tokens.txt & Inject Sherpa-ONNX Metadata into Voices/*.onnx
        run: |
          python3 -c "
          import json, os, glob

          def encode_varint(val):
              out = bytearray()
              while True:
                  b = val & 0x7F
                  val >>= 7
                  if val:
                      out.append(b | 0x80)
                  else:
                      out.append(b)
                      break
              return bytes(out)

          def encode_string_field(field_num, s):
              raw = s.encode('utf-8')
              tag = (field_num << 3) | 2
              return encode_varint(tag) + encode_varint(len(raw)) + raw

          def encode_metadata_prop(key, value):
              entry = encode_string_field(1, str(key)) + encode_string_field(2, str(value))
              tag14 = (14 << 3) | 2
              return encode_varint(tag14) + encode_varint(len(entry)) + entry

          for json_path in sorted(glob.glob('Voices/**/*.onnx.json', recursive=True)):
              folder = os.path.dirname(json_path)
              with open(json_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              items = sorted(data.get('phoneme_id_map', {}).items(), key=lambda kv: kv[1][0])
              tokens_path = os.path.join(folder, 'tokens.txt')
              with open(tokens_path, 'w', encoding='utf-8', newline='\n') as tf:
                  for sym, id_list in items:
                      tf.write(f'{sym} {id_list[0]}\n')
              print('Verified tokens:', tokens_path, len(items))

              onnx_path = json_path[:-5]
              if os.path.exists(onnx_path) and os.path.getsize(onnx_path) > 1024 * 1024:
                  with open(onnx_path, 'r+b') as mf:
                      size = os.path.getsize(onnx_path)
                      seek_pos = max(0, size - 1024)
                      mf.seek(seek_pos)
                      tail = mf.read(size - seek_pos)
                      if b'piper' in tail:
                          tail = tail.replace(b'piper', b'coqui')
                          mf.seek(seek_pos)
                          mf.write(tail)
                      if not (b'add_blank' in tail and b'bos_id' in tail and b'sample_rate' in tail):
                          meta = {
                              'model_type': 'vits',
                              'comment': 'coqui',
                              'has_espeak': '1',
                              'language': 'Vietnamese',
                              'voice': data.get('espeak', {}).get('voice', 'vi'),
                              'sample_rate': str(data.get('audio', {}).get('sample_rate', 22050)),
                              'n_speakers': str(data.get('num_speakers', 1)),
                              'add_blank': '1',
                              'blank_id': '0',
                              'bos_id': '1',
                              'eos_id': '2',
                              'pad_id': '0',
                              'use_eos_bos': '1',
                          }
                          blob = b''.join(encode_metadata_prop(k, v) for k, v in meta.items())
                          mf.seek(0, 2)
                          mf.write(blob)
                          print('Injected Sherpa-ONNX BOS+PAD metadata into:', onnx_path)
                      else:
                          print('Sherpa-ONNX BOS+PAD metadata already present in:', onnx_path)
          "

      - name: Build Runnable APK (assembleDebug)
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk LangKinhHuKhongTTS-v1.0.0.apk
          ls -lh LangKinhHuKhongTTS-v1.0.0.apk

      - name: Upload Runnable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangKinhHuKhongTTS-APK
          path: LangKinhHuKhongTTS-v1.0.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Lăng Kính Hư Không TTS Studio v1.0.0 (Runnable APK)"
          body: |
            ## Lăng Kính Hư Không Mobile TTS Studio (`v1.0.0`)
            File cài đặt trực tiếp trên Android: **`LangKinhHuKhongTTS-v1.0.0.apk`**

            ### Tính năng chính:
            - **Kết xuất giọng đọc AI ONNX Piper Offline chuẩn như bản PC** (`Sherpa-ONNX 1.12.40` + `espeak-ng-data` + `WavPacing` + `SonicAudioProcessor` giữ nguyên cao độ giọng + đồng bộ phụ đề theo PCM frame).
            - **Mở sẵn TẤT CẢ 9 giọng đọc từ 5 bộ model** (`Minh Khang`, `Ngọc Huyền`, `Lạc Phi`, `Minh Quang`, `VPBank` 5 giọng) • **Giới hạn 500 ký tự/chu kỳ**, hết ký tự tự động nhảy quảng cáo để cấp thêm 500 ký tự.
            - **Biên tập Video Short `9:16` ($\le 3$ phút):** Cắt ngắn đầu/đuôi Video, tắt/bật âm thanh gốc MP4, cắt chia đoạn Voice MP3 kéo thả tùy ý, chỉnh Size Text Phụ đề (`10-36sp`) & Size Text (`10-56sp`), chèn Logo PNG & làm mờ.
          files: |
            LangKinhHuKhongTTS-v1.0.0.apk
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
