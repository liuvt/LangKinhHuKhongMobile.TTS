name: Build & Publish Runnable APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (with LFS if enabled)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare app/libs & Generate tokens.txt from Voices/*.onnx.json
        run: |
          mkdir -p app/libs
          python3 -c "
          import json, os, glob
          for json_path in glob.glob('Voices/**/*.onnx.json', recursive=True):
              folder = os.path.dirname(json_path)
              with open(json_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              items = sorted(data.get('phoneme_id_map', {}).items(), key=lambda kv: kv[1][0])
              tokens_path = os.path.join(folder, 'tokens.txt')
              with open(tokens_path, 'w', encoding='utf-8', newline='\n') as tf:
                  for sym, id_list in items:
                      tf.write(f'{sym} {id_list[0]}\n')
              print('Verified tokens:', tokens_path, len(items))
          "

      - name: Build Runnable APK (assembleDebug)
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk LangKinhHuKhongTTS-v1.0.0.apk
          ls -lh LangKinhHuKhongTTS-v1.0.0.apk

      - name: Upload Runnable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangKinhHuKhongTTS-APK
          path: LangKinhHuKhongTTS-v1.0.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Lăng Kính Hư Không TTS Studio v1.0.0 (Runnable APK)"
          body: |
            ## Lăng Kính Hư Không Mobile TTS Studio (`v1.0.0`)
            File cài đặt trực tiếp trên Android: **`LangKinhHuKhongTTS-v1.0.0.apk`**

            ### Tính năng chính:
            - **Chuyển Text thành Voice AI + Tự động ghép Sub phụ đề kèm theo** (Tích hợp 5 bộ model: `Minh Khang`, `Ngọc Huyền`, `Lạc Phi`, `Minh Quang`, `VPBank` 5 giọng).
            - **Biên tập Video Short `9:16` ($\le 3$ phút):** Cắt ngắn đầu/đuôi Video, tắt/bật âm thanh gốc của file MP4, chỉnh tốc độ `0.5x` - `2.0x`.
            - **Cắt chia đoạn Voice MP3 (Part) & Kéo thả khớp với Video tùy ý.**
            - **Chèn Chữ (`Text`) & Icon/Logo `PNG`:** Hỗ trợ làm mờ trong suốt (`Opacity`) + làm mờ nhòe (`Gaussian Blur`) và kéo thả vị trí bất kỳ trực tiếp trên Khu View `9:16`.
          files: |
            LangKinhHuKhongTTS-v1.0.0.apk
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
